<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title description">
  <title id="title">SharePoint for MCP clients</title>
  <desc id="description">Local agentic MCP clients connect over stdio to a SharePoint Connector running on this computer. It reads OneDrive and SharePoint through Microsoft Graph's official API only, and it is read-only: it searches files the account can read, reads one result's metadata, and downloads one selected file. ChatGPT web can reach the same local server through OpenAI's Secure MCP Tunnel.</desc>
